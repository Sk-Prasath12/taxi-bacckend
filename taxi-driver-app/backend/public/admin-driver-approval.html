<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taxi — Admin driver approval</title>
  <style>
    :root { --bg: #0f1419; --card: #1a222d; --text: #e8eef4; --muted: #8b9aab; --green: #22c55e; --gold: #d4a017; --red: #ef4444; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
    input, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: var(--card); color: var(--text); }
    input { min-width: 200px; flex: 1; }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--green); color: #052e16; border: none; }
    button.danger { background: var(--red); color: #fff; border: none; }
    button.secondary { background: var(--gold); color: #1a1400; border: none; }
    section { margin-top: 28px; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #2a3544; font-size: 0.88rem; }
    th { color: var(--muted); font-weight: 600; }
    .mono { font-family: ui-monospace, monospace; font-size: 0.78rem; word-break: break-all; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
    .badge-pending { background: #422006; color: #fcd34d; }
    .badge-ok { background: #052e16; color: var(--green); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    #msg { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; }
    #msg.ok { display: block; background: #052e16; color: var(--green); }
    #msg.err { display: block; background: #450a0a; color: #fca5a5; }
  </style>
</head>
<body>
  <h1>Driver account approval</h1>
  <p class="sub">Approve email/password signup. After approve, driver can go online and accept rides (documents optional). Default admin key: <code>dev-admin-key</code></p>

  <div class="bar">
    <input type="password" id="adminKey" placeholder="Admin API key (x-admin-key)" />
    <input type="text" id="search" placeholder="Search name / email / phone (e.g. kiruba12)" />
    <button class="secondary" type="button" onclick="loadAll()">Refresh</button>
    <button class="primary" type="button" onclick="approveByLogin()">Approve login in search</button>
  </div>
  <div id="msg"></div>

  <section>
    <h2>Pending approval (<span id="pendingCount">0</span>)</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Driver ID (Mongo)</th>
          <th>Status</th>
          <th>Docs</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="pendingBody"></tbody>
    </table>
  </section>

  <section>
    <h2>Recently approved (<span id="approvedCount">0</span>)</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Driver ID</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="approvedBody"></tbody>
    </table>
  </section>

  <script>
    const keyEl = document.getElementById('adminKey');
    const searchEl = document.getElementById('search');
    keyEl.value = localStorage.getItem('taxi_admin_key') || 'dev-admin-key';

    function showMsg(text, ok) {
      const m = document.getElementById('msg');
      m.textContent = text;
      m.className = ok ? 'ok' : 'err';
    }

    async function api(path, options = {}) {
      localStorage.setItem('taxi_admin_key', keyEl.value.trim());
      const headers = {
        'Content-Type': 'application/json',
        'x-admin-key': keyEl.value.trim(),
        ...(options.headers || {})
      };
      const res = await fetch('/api/admin' + path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || res.statusText);
      return data;
    }

    function rowPending(d) {
      const id = d.driver_id || d.id;
      return `<tr>
        <td>${esc(d.name)}</td>
        <td>${esc(d.email)}</td>
        <td class="mono">${esc(id)} <button type="button" onclick="copyId('${esc(id)}')">Copy</button></td>
        <td><span class="badge badge-pending">${esc(d.driver_verification_status)}</span></td>
        <td>${d.documents_uploaded ?? 0} optional</td>
        <td class="actions">
          <button class="primary" type="button" onclick="approve('${esc(id)}')">Approve</button>
          <button class="danger" type="button" onclick="reject('${esc(id)}')">Reject</button>
        </td>
      </tr>`;
    }

    function rowApproved(d) {
      const id = d.driver_id || d.id;
      return `<tr>
        <td>${esc(d.name)}</td>
        <td>${esc(d.email)}</td>
        <td class="mono">${esc(id)}</td>
        <td><span class="badge badge-ok">APPROVED</span></td>
      </tr>`;
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    }

    function copyId(id) {
      navigator.clipboard.writeText(id);
      showMsg('Copied driver ID: ' + id, true);
    }

    async function approveByLogin() {
      const login = searchEl.value.trim();
      if (!login) return showMsg('Enter login id in search box (e.g. kiruba12)', false);
      try {
        const data = await api('/drivers/approve-by-login', {
          method: 'POST',
          body: JSON.stringify({ login_id: login })
        });
        showMsg('Approved ' + (data.driver?.email || login), true);
        loadAll();
      } catch (e) {
        showMsg(e.message, false);
      }
    }

    async function approve(id) {
      try {
        const data = await api('/drivers/' + id + '/approve', {
          method: 'POST',
          body: JSON.stringify({ note: 'Approved via admin panel' })
        });
        showMsg('Approved ' + (data.driver?.email || id) + ' — driver app can go online now.', true);
        loadAll();
      } catch (e) {
        showMsg(e.message, false);
      }
    }

    async function reject(id) {
      const reason = prompt('Reject reason (optional):') || 'Rejected by admin';
      try {
        await api('/drivers/' + id + '/reject', {
          method: 'POST',
          body: JSON.stringify({ reason })
        });
        showMsg('Rejected driver ' + id, true);
        loadAll();
      } catch (e) {
        showMsg(e.message, false);
      }
    }

    async function loadAll() {
      const q = searchEl.value.trim();
      const qs = q ? '?q=' + encodeURIComponent(q) : '';
      try {
        const pending = await api('/drivers/pending' + qs);
        const approved = await api('/drivers/approved' + qs);
        document.getElementById('pendingCount').textContent = pending.count ?? pending.data?.length ?? 0;
        document.getElementById('approvedCount').textContent = approved.count ?? approved.data?.length ?? 0;
        document.getElementById('pendingBody').innerHTML = (pending.data || []).map(rowPending).join('') || '<tr><td colspan="6">No pending drivers</td></tr>';
        document.getElementById('approvedBody').innerHTML = (approved.data || []).map(rowApproved).join('') || '<tr><td colspan="4">No approved drivers yet</td></tr>';
      } catch (e) {
        showMsg('Load failed: ' + e.message, false);
      }
    }

    searchEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadAll(); });
    loadAll();
  </script>
</body>
</html>
