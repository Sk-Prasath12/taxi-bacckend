org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Flutter built-in Kotlin (avoids KGP conflicts with plugins)
android.builtInKotlin=true
android.newDsl=false

# Fix Kotlin incremental cache errors when project (D:) and pub cache (C:) are on different drives
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=false
