name: taxi_user
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🗺️ Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0

  # 🌐 API
  http: ^1.2.1
  connectivity_plus: ^6.1.3
  flutter_dotenv: ^5.2.1

  # 🔌 Socket
  socket_io_client: ^2.0.3+1

  # 💾 Local Storage
  shared_preferences: ^2.2.2

  # 📅 Utils
  intl: ^0.20.2

  # 🎥 Media
  video_player: ^2.9.1
  image_picker: ^1.0.7

  # 💳 Payments
  razorpay_flutter: ^1.4.4
  qr_flutter: ^4.1.0

  # 🔥 FIREBASE (UPDATED)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo1.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo1.png"
    background_color: "#FDB813"
    theme_color: "#FDB813"

flutter:
  uses-material-design: true

  assets:
    - assets/env/app.env
    - assets/env/dev.env
    - assets/images/logo1.png
    - assets/images/logo.png
    - assets/traveling page/taxi_drive.png
    - assets/payamenttype/cash.mp4
    - assets/payamenttype/creditcard.mp4
    - assets/payamenttype/Upi.mp4
    - assets/taxi_types/taxi1.jpeg
    - assets/taxi_types/taxi2.jpeg
    - assets/taxi_types/taxi3.jpeg
